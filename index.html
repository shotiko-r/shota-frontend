<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Unitasks — უნივერსალური დავალებების მენეჯერი">
  <title>Unitasks — შესვლა</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="watermark" aria-hidden="true">
    <span class="watermark__line">Unitasks</span>
    <span class="watermark__line watermark__line--secondary">უნივერსალური დავალებების მენეჯერი</span>
    <span class="watermark__accent"></span>
  </div>

  <div class="page">
    <header class="site-header">
      <a class="site-header__brand" href="index.html" aria-label="Unitasks მთავარი გვერდი">
        <span class="site-header__logo" aria-hidden="true">UT</span>
        <span>Unitasks</span>
      </a>
      <nav class="nav" aria-label="მთავარი ნავიგაცია">
        <button type="button" class="nav__toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="მენიუს გახსნა">
          <span class="nav__toggle-bar"></span>
          <span class="nav__toggle-bar"></span>
          <span class="nav__toggle-bar"></span>
        </button>
        <ul id="primary-nav" class="nav__links">
          <li><a class="nav__link" href="#hero">მთავარი</a></li>
          <li><a class="nav__link" href="#login">შესვლა</a></li>
        </ul>
      </nav>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="თემის ცვლა" role="switch">
        <span aria-hidden="true">☀️</span>
        <span aria-hidden="true">🌙</span>
      </button>
    </header>

    <main id="hero" class="hero">
      <div class="hero__copy">
        <span class="hero__eyebrow">უნივერსალური დავალებების მენეჯერი</span>
        <h1 class="hero__title">
          <span class="hero__title-accent">Unitasks</span> — სამუშაო დავალებები ერთ სივრცეში
        </h1>
        <p class="hero__lead">
          დაგეგმე, გაანაწილე და მართე დავალებები გუნდთან ერთად — მარტივად და პროფესიონალურად.
        </p>
        <div class="hero__cta-row">
          <a class="btn btn--primary" href="#login">სისტემაში შესვლა</a>
        </div>
      </div>

      <section id="login" class="hero__card" aria-labelledby="login-heading">
        <h2 id="login-heading" class="hero__card-title">შესვლა</h2>
        <p id="loggedInNotice" class="login-notice" hidden></p>
        <form class="login-form" id="loginForm" novalidate>
          <div class="form-group">
            <label class="visually-hidden" for="username">მომხმარებელი</label>
            <input class="input" id="username" name="username" autocomplete="username" placeholder="მომხმარებელი" required>
          </div>
          <div class="form-group">
            <label class="visually-hidden" for="password">პაროლი</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="პაროლი" required>
          </div>
          <button class="btn btn--primary btn--block" type="submit">შესვლა</button>
        </form>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/constants.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
